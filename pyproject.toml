[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhab-install-scripts-suite"
version = "0.1.0"
description = "Community examples for provisioning and checking openHAB bindings with Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "python-openhab-rest-client>=21.4.0",
  "openhab-test-suite",
  "python-dotenv>=1.0",
  "Jinja2>=3.1",
]

[project.scripts]
oh-suite = "openhab_install_scripts_suite.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

